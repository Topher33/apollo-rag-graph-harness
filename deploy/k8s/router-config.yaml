# Apollo Router config (mounted at /config/router.yaml). Local supergraph, no GraphOS.
supergraph:
  listen: 0.0.0.0:4000
  introspection: true        # needed so the MCP server's introspection tools work
health_check:
  listen: 0.0.0.0:8088
include_subgraph_errors:
  all: true                  # demo only
