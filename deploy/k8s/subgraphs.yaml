apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers
  labels: { app: customers, app.kubernetes.io/part-of: apollo-harness-demo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: customers }
  template:
    metadata:
      labels: { app: customers, app.kubernetes.io/part-of: apollo-harness-demo }
    spec:
      containers:
        - name: customers
          image: harness/demo-subgraphs
          imagePullPolicy: IfNotPresent
          env:
            - { name: SUBGRAPH, value: "customers" }
            - { name: PORT, value: "4001" }
            - { name: SEED, value: "42" }
          ports:
            - { name: http, containerPort: 4001 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: customers
  labels: { app: customers }
spec:
  selector: { app: customers }
  ports:
    - { name: http, port: 4001, targetPort: http }
---
